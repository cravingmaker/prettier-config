name: Synchronize Dependabot Effect reference

on:
  # The job checks out only trusted default-branch code, never the pull request or its
  # artifacts, and accepts only same-repository Dependabot branches.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    types:
      - completed
    branches:
      - dependabot/npm_and_yarn/effect-reference-*

permissions: {}

concurrency:
  group: effect-reference-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize Effect reference
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # workflow_run uses trusted default-branch code, never the PR checkout or artifacts.
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install trusted tooling dependencies
        run: npm ci --ignore-scripts

      # App commits trigger the normal PR checks; GITHUB_TOKEN commits would not.
      - name: Create repository-scoped bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read

      - name: Synchronize source version, tag, and commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EFFECT_PR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EFFECT_PR_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/sync-dependabot-effect-reference.mjs
