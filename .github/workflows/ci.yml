name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-static:
    name: Shared static checks
    if: ${{ github.head_ref != 't3code/ci-gate-probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup development Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate repository and package static checks
        run: npm run validate:static

  minimum-peers:
    name: Minimum peer versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
      PRETTIER_CONFIG_PEER_SCENARIO: minimum
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup development Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test minimum peers and custom stylesheets
        run: npm run test:package

  macos-lifecycle:
    name: macOS lifecycle
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup development Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test native process lifecycle and paths
        run: npm run test:lifecycle

  validate:
    name: Node.js ${{ matrix.node-version }}
    needs:
      - shared-static
      - minimum-peers
      - macos-lifecycle
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26

    env:
      HUSKY: 0

    steps:
      - name: Require successful shared checks
        env:
          SHARED_STATIC_RESULT: ${{ needs.shared-static.result }}
          MINIMUM_PEERS_RESULT: ${{ needs.minimum-peers.result }}
          MACOS_LIFECYCLE_RESULT: ${{ needs.macos-lifecycle.result }}
        run: |
          if [ "$SHARED_STATIC_RESULT" != "success" ] ||
             [ "$MINIMUM_PEERS_RESULT" != "success" ] ||
             [ "$MACOS_LIFECYCLE_RESULT" != "success" ]; then
            echo "::error::CI prerequisites did not all succeed (static=$SHARED_STATIC_RESULT, minimum peers=$MINIMUM_PEERS_RESULT, macOS lifecycle=$MACOS_LIFECYCLE_RESULT)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test behavior and npm-installed consumers
        run: npm run validate:behavior

  minimum-runtime:
    name: Minimum Node.js 22.12.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Development tools require newer Node.js versions than the runtime config.
      - name: Setup development Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup minimum runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0

      - name: Capture minimum runtime executable
        id: minimum-node
        run: echo "executable=$(node --print process.execPath)" >> "$GITHUB_OUTPUT"

      - name: Restore development Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Pack and run the test harness on development Node; execute consumers on the minimum.
      - name: Test packed package on minimum runtime
        env:
          PRETTIER_CONFIG_CONSUMER_NODE: ${{ steps.minimum-node.outputs.executable }}
        run: npm run test:package
