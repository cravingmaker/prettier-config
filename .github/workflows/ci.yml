name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# Supersede outdated pull request runs; every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Run static checks
        run: npm run validate:static

  minimum-peers:
    name: Minimum peer versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PRETTIER_CONFIG_PEER_SCENARIO: minimum
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test minimum peers and custom stylesheets
        run: npm run test:package

  runtime:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported release, then the newest release of each supported line.
        node-version:
          - 22.12.0
          - 22
          - 24
          - 26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Resolve the newest release of a line instead of an older cached runner copy. The cache
      # stays off: setting it up runs npm, and the npm of Node.js 22 fails the devEngines check.
      - name: Set up runtime Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          package-manager-cache: false

      - name: Capture runtime executable
        id: runtime-node
        run: echo "executable=$(node --print process.execPath)" >> "$GITHUB_OUTPUT"

      # The runtime suite can run below npm's development-engine requirement.
      - name: Test runtime behavior
        run: node --run test:runtime

      - name: Restore development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # npm and TypeScript run on development Node.js; the consumer programs run on the runtime.
      - name: Test npm-installed consumers
        env:
          PRETTIER_CONFIG_CONSUMER_NODE: ${{ steps.runtime-node.outputs.executable }}
        run: npm run test:package

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up development Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # npm audit reads the lockfile, so nothing is installed. As its own job, an advisory that
      # was published after the last dependency change fails CI without hiding other results.
      - name: Audit dependencies
        run: npm audit --audit-level=low

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Compares the pull request's base and head dependency graphs; no checkout is needed.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # The single status for rulesets: it fails unless every job above succeeded.
  # Dependency Review is skipped outside pull requests.
  result:
    name: CI result
    if: ${{ always() }}
    needs:
      - static
      - minimum-peers
      - runtime
      - audit
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq --raw-output 'to_entries[]
            | select(.value.result != "success" and (.key != "dependency-review" or .value.result != "skipped"))
            | "\(.key)=\(.value.result)"' <<< "${NEEDS}")"

          if [ -n "${failed}" ]; then
            echo "::error::CI jobs did not succeed: $(echo "${failed}" | tr '\n' ' ')"
            exit 1
          fi
