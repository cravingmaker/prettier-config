name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24
          - 26

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate
        run: npm run validate

      - name: Verify package contents
        run: npm pack --dry-run

  minimum-runtime:
    name: Minimum Node.js 22.12.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Development tools require newer Node.js versions than the runtime config.
      - name: Setup development Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Setup minimum runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0

      - name: Capture minimum runtime executable
        id: minimum-node
        run: echo "executable=$(node --print process.execPath)" >> "$GITHUB_OUTPUT"

      - name: Restore development Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Pack and run the test harness on development Node; execute consumers on the minimum.
      - name: Test packed package on minimum runtime
        env:
          PRETTIER_CONFIG_CONSUMER_NODE: ${{ steps.minimum-node.outputs.executable }}
        run: npm run test:package
